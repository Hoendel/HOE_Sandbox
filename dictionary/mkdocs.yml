      - "Charaktererstellung": rules/charaktererstellung.md
      - "Charakterbögen": rules/charakterboegen.md
      - "Regeln": rules/regeln.md
  - "📋 Spielleiterhilfen":
      - "Vorbereitung": spielleiterhilfen/spielleiterhilfen.md
      - "Materialsystem": spielleiterhilfen/materiallisten.md
  - "🪖 Kadettschaft":
