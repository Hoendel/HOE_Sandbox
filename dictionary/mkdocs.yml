site_name: Nand - RPG
site_url: https://hoendel.github.io/HOE_Sandbox/
site_description: Offizielles Regel- und Setting-Kompendium zum Nand-RPG
repo_url: https://github.com/Hoendel/HOE_Sandbox
repo_name: HOE_Sandbox

docs_dir: docs_sample
use_directory_urls: true

theme:
  name: material
  language: de
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.prune
    - navigation.indexes
    - navigation.footer
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dunkles Design aktivieren
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Helles Design aktivieren

extra:
  announcement: "NAND – das Rollenspiel · Offizielles Regel- & Setting-Kompendium"

extra_css:
  - assets/css/banner.css
  - assets/css/aa.css
  - assets/css/typography.css
  - assets/css/sidebar-primary.css
  - assets/css/sidebar-secondary.css
  - assets/css/tokens.css

extra_javascript:
  - assets/js/aa.js
  #- assets/js/sidebar-auto.js

plugins:
  - search:
      lang: de

copyright: "© 2025 Nand – RPG"

nav:
  - "🏠 Startseite":
      - "Willkommen": index.md
      - "Nie wieder !": startseite/nie_wieder.md
      - "Sound": startseite/sound.md
